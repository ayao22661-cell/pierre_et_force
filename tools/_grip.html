<html><head><base href="../"></head><body style="margin:0;background:#303038"><canvas id=c style="width:100vw;height:100vh"></canvas>
<script src="lib/babylon.js"></script><script src="lib/babylonjs.loaders.min.js"></script>
<script type="module">
import { BabylonUnits } from './js/engine/babylon-units.js';
(async()=>{try{
const q=new URLSearchParams(location.search);
const key=q.get('k')||'TARINE';
const MOD={TARINE:'TARINE.glb',SAM:'SAM.glb',LUNDGREN:'LUNDGREN.glb',KAREN:'KAREN.glb',FULGENCE:'FULGENCE.glb',BABA:'BABA_TUNDE.glb',DARK:'DARK.glb',SYLLA:'SYLLA.glb',SCHISSIN:'SCHISSIN.glb',OUSMANE:'OUSMANE.glb',SUB:'SUB.glb',GROB:'GROB.glb',KRAG:'KRAG.glb',VAEL:'SAMIA.glb',SGRUN:'SGRUN.glb'};
const eng=new BABYLON.Engine(document.getElementById('c'),true,{preserveDrawingBuffer:true});
const sc=new BABYLON.Scene(eng);sc.clearColor=new BABYLON.Color4(.62,.64,.68,1);
new BABYLON.HemisphericLight('h',new BABYLON.Vector3(.3,1,.2),sc).intensity=1;
new BABYLON.DirectionalLight('s',new BABYLON.Vector3(-.5,-1,-.4),sc).intensity=1;
const m=await BABYLON.SceneLoader.ImportMeshAsync('','assets/models/',q.get('model')||MOD[key],sc);
for(const ag of sc.animationGroups) ag.dispose();
if(q.get('dbg2')) for(const me of m.meshes){ me.computeWorldMatrix(true); const bb=me.getBoundingInfo().boundingBox; console.log('MESH', me.name, me.getTotalVertices(), 'vis', me.isVisible, 'min', bb.minimumWorld.toString(), 'max', bb.maximumWorld.toString(), 'mat', me.material&&me.material.getClassName(), me.material&&me.material.alpha, 'skel', !!me.skeleton, 'scale', me.absoluteScaling&&me.absoluteScaling.toString()); }
const nodes=new Map();
for(const b of m.skeletons[0].bones){const t=b.getTransformNode&&b.getTransformNode(); if(t) nodes.set(b.name,t);}
const clip=q.get('anim')||'pro-sword-and-shield-pack-sword-and-shield-idle.glb';
const cont=await BABYLON.SceneLoader.LoadAssetContainerAsync('assets/animations/',clip,sc);
const g=cont.animationGroups[cont.animationGroups.length-1];
const ag=new BABYLON.AnimationGroup('a',sc);
for(const ta of g.targetedAnimations){const t=nodes.get(ta.target.name); if(t) ag.addTargetedAnimation(ta.animation,t);}
ag.start(true); ag.goToFrame(parseInt(q.get('f')||'20'));
const cam0=new BABYLON.ArcRotateCamera('tmp',-1.2,1.3,3,new BABYLON.Vector3(0,1,0),sc);
sc.render();
// On appelle le VRAI code du moteur (_attachWeapons/_measureGrip) plutôt
// que d'en recopier une version : l'outil teste ce qui tourne en jeu.
const nodeByBaseName=new Map();
for(const [n,t] of nodes) nodeByBaseName.set(n,t);
const fake={ scene: sc, _loadProp: (f)=>BABYLON.SceneLoader.LoadAssetContainerAsync('assets/props/',f,sc),
  _measureGrip: BabylonUnits.prototype._measureGrip, _weaponShape: BabylonUnits.prototype._weaponShape, _strapOnForearm: BabylonUnits.prototype._strapOnForearm };
for(const n of Object.getOwnPropertyNames(BabylonUnits.prototype)) if(n.startsWith('_')&&!fake[n]) fake[n]=BabylonUnits.prototype[n];
const inst={ nodeByBaseName, disposed:false };
const mode=q.get('axis');
if(mode) for(const w of (await import('./js/engine/babylon-units.js')).WEAPON_BY_KEY[key]) w.axis=mode;
const unitT={ key, id: 1 };
if(q.get('gear')){ const { ITEMS } = await import('./js/data/items.js'); unitT.gear={}; for(const id of q.get('gear').split(',')){ const it=ITEMS.find(i=>i.id===id); if(it) unitT.gear[it.slot]=it; } }
await BabylonUnits.prototype._attachWeapons.call(fake, inst, unitT);
if(q.get('dbg')){ const g=fake._measureGrip.call(fake, inst, 'mixamorig:RightHand'); console.log('BONES', [...nodes.keys()].filter(n=>/RightHand/.test(n)).join(','), 'axis', g.axis.toString(), 'up', g.up.toString(), 'grip', g.grip.toString());
 const h=nodes.get('mixamorig:RightHand'); const sp=nodes.get('mixamorig:Spine1'); h.computeWorldMatrix(true); const ax=BABYLON.Vector3.TransformNormal(g.axis,h.getWorldMatrix()).normalize(); console.log('world axis', ax.toString(), 'hand', h.getAbsolutePosition().toString(), 'spine', sp.getAbsolutePosition().toString()); }

// cadrage serré sur la main droite (ou le personnage entier)
const hand=nodes.get('mixamorig:RightHand');
hand.computeWorldMatrix(true);
let focus=q.get('wide')?new BABYLON.Vector3(0,1,0):hand.getAbsolutePosition();
if(q.get('focus')==='arme' && inst.weapons?.[0]){ inst.weapons[0].computeWorldMatrix(true); focus=inst.weapons[0].getAbsolutePosition().clone(); }
cam0.dispose();
const cam=new BABYLON.ArcRotateCamera('c',parseFloat(q.get('a')||'-1.2'),parseFloat(q.get('b')||'1.3'),parseFloat(q.get('r')||(q.get('wide')?'4':'0.9')),focus,sc);
cam.minZ=0.01;
await sc.whenReadyAsync();for(let i=0;i<4;i++)sc.render();
document.title='DONE';
}catch(e){document.title='ERR';console.log('ERREUR',e.stack)}})();
</script></body></html>
