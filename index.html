<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pierre et Force — L'Éveil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/hud.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.17.1/pixi.min.js"></script>
<!-- Babylon.js : rendu 3D des personnages (modèles GLB), superposé au canvas PixiJS.
     CDN officiel Babylon (toujours la dernière version stable) — voir
     https://doc.babylonjs.com/setup/frameworkPackages/frameworkVers -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
<div id="app">

  <!-- ===== TITRE ===== -->
  <div id="screen-title" class="screen active">
    <!-- Fond plein écran : l'esprit divin veillant sur le porteur -->
    <div class="pf-bg">
      <img src="assets/art_divine.webp" class="pf-bg-blur" alt="">
      <img src="assets/art_divine.webp" class="pf-bg-img" alt="">
      <div class="pf-bg-overlay"></div>
    </div>
    <div class="pf-title-content">
      <!-- Version claire du logo : le lettrage d'origine est noir et
           disparaissait sur l'illustration sombre. Le logo porte déjà le
           nom du jeu, le titre en double a donc été retiré. -->
      <img class="pf-logo" src="assets/logo-clair.webp" alt="Pierre et Force">
      <div class="pf-hero-sub">L'ÉVEIL</div>
      <div class="pf-title-btns">
        <button class="pf-btn pf-btn-brand" id="btn-start">COMMENCER</button>
      </div>
    </div>
  </div>

  <!-- ===== SÉLECTION DE SAUVEGARDE ===== -->
  <div id="screen-slots" class="screen">
    <div class="pf-bg">
      <img src="assets/art_divine.webp" class="pf-bg-blur" alt="">
      <img src="assets/art_divine.webp" class="pf-bg-img" alt="">
      <div class="pf-bg-overlay"></div>
    </div>
    <div class="slots-content">
      <div class="pf-title" style="font-size:20px; margin-bottom:14px;">SAUVEGARDES</div>
      <div id="slots-list" class="slots-list"></div>
      <button class="pf-btn pf-btn-ghost" id="btn-slots-back" style="margin-top:14px;">← RETOUR</button>
    </div>
  </div>

  <!-- ===== HUB ===== -->
  <div id="screen-hub" class="screen">
    <!-- Fond plein écran : portrait de Tarine, le porteur -->
    <div class="pf-bg">
      <img src="assets/art_warrior.webp" class="pf-bg-blur" alt="">
      <img src="assets/art_warrior.webp" class="pf-bg-img" alt="">
      <div class="pf-bg-overlay"></div>
    </div>
    <div class="pf-panel hub-header" style="padding:10px 14px;">
      <div>
        <div class="pf-title" style="font-size:18px;">PIERRE ET FORCE</div>
        <div class="pf-label" id="hub-progress">0 / 0 missions</div>
      </div>
      <div style="display:flex; gap:14px; align-items:center;">
        <span class="pf-badge pf-badge-gold">NIV. <span id="hub-level">1</span></span>
        <span class="pf-badge" id="hub-cauris-badge"><span id="hub-cauris">0</span></span>
      </div>
    </div>
    <div class="hub-body">
      <div class="hub-panel active" id="panel-missions" data-panel="missions">
        <div id="hub-missions"></div>
      </div>
      <div class="hub-panel" id="panel-codex" data-panel="codex">
        <div class="codex-filters" id="codex-filters">
          <button class="pf-btn pf-btn-sm codex-chip active" data-camp="tous">Tous</button>
          <button class="pf-btn pf-btn-sm codex-chip" data-camp="allie">Alliés</button>
          <button class="pf-btn pf-btn-sm codex-chip" data-camp="ennemi">Empire</button>
          <button class="pf-btn pf-btn-sm codex-chip" data-camp="neutre">Légende</button>
        </div>
        <div class="champ-grid" id="codex-list"></div>
      </div>
      <div class="hub-panel" id="panel-profile" data-panel="profile">
        <div id="profile-content"></div>
      </div>
      <div class="hub-panel" id="panel-journal" data-panel="journal">
        <div class="journal-entries" id="journal-entries"></div>
      </div>
      <div class="hub-panel" id="panel-eveil" data-panel="eveil">
        <div id="eveil-content"></div>
      </div>
      <div class="hub-panel" id="panel-shop" data-panel="shop">
        <div id="shop-content"></div>
      </div>
    </div>
    <div class="hub-tabs">
      <button class="hub-tab-btn active" data-tab="missions">MISSIONS</button>
      <button class="hub-tab-btn" data-tab="codex">HÉROS</button>
      <button class="hub-tab-btn" data-tab="profile">PROFIL</button>
      <button class="hub-tab-btn" data-tab="journal">JOURNAL</button>
      <button class="hub-tab-btn" data-tab="eveil">ÉVEIL</button>
      <button class="hub-tab-btn" data-tab="shop">BOUTIQUE</button>
    </div>
  </div>

  <!-- ===== DÉPLOIEMENT ===== -->
  <div id="screen-deploy" class="screen">
    <!-- Fond plein écran : affrontement, tension avant le combat -->
    <div class="pf-bg">
      <img src="assets/art_battle1.webp" class="pf-bg-blur" alt="">
      <img src="assets/art_battle1.webp" class="pf-bg-img" alt="">
      <div class="pf-bg-overlay"></div>
    </div>
    <div class="pf-panel" style="padding:10px 14px; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div class="pf-title" id="deploy-mission-name" style="font-size:16px;">Mission</div>
        <div class="pf-label" id="deploy-mode">SIÈGE</div>
      </div>
      <button class="pf-btn pf-btn-ghost" id="btn-hub-back">RETOUR</button>
    </div>
    <div class="deploy-body">
      <div class="pf-panel" style="padding:12px;">
        <div class="pf-label" style="margin-bottom:8px;">TON PERSONNAGE</div>
        <div id="deploy-player" class="champ-tile-row"></div>
      </div>
      <div class="pf-panel" style="padding:12px;">
        <div class="pf-label" style="margin-bottom:6px;">SITUATION</div>
        <div id="deploy-brief" style="font-size:13px; line-height:1.5; color:var(--pf-text-dim);"></div>
      </div>
      <div class="pf-panel" style="padding:12px;">
        <div class="pf-label" style="margin-bottom:8px;">ALLIÉ DISPONIBLE (1 max)</div>
        <div id="deploy-allies-grid" class="champ-tile-row"></div>
      </div>
    </div>
    <div class="deploy-footer">
      <div class="pf-label" id="deploy-team-preview" style="flex:1;">Équipe : Tarine</div>
      <button class="pf-btn pf-btn-brand" id="btn-launch">ENTRER EN COMBAT</button>
    </div>
  </div>

  <!-- ===== COMBAT ===== -->
  <div id="screen-game" class="screen">
    <div id="game-mount"></div>
    <div id="game-hud"></div>
  </div>

  <!-- ===== FIN DE MATCH ===== -->
  <div id="screen-end" class="screen">
    <!-- Fond plein écran : élan héroïque au-dessus de l'armée -->
    <div class="pf-bg">
      <img src="assets/art_battle3.webp" class="pf-bg-blur" alt="">
      <img src="assets/art_battle3.webp" class="pf-bg-img" alt="">
      <div class="pf-bg-overlay"></div>
    </div>
    <div class="pf-title" id="end-title" style="font-size:40px; letter-spacing:5px; margin-top:40px;">VICTOIRE</div>
    <div class="pf-label" id="end-subtitle" style="font-size:13px; margin-bottom:18px;"></div>
    <div id="end-rewards"></div>
    <div class="end-btns">
      <button class="pf-btn pf-btn-brand" id="btn-hub">RETOUR AU HUB</button>
      <button class="pf-btn" id="btn-retry">RÉESSAYER</button>
    </div>
  </div>

  <div id="pf-toast"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
